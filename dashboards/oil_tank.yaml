# Card snippet for the live Heating oil dashboard (UI storage).
# Overview / Home is also storage mode — do not set lovelace.mode: yaml.
# Default tank device name is My Tank. Search Developer tools → States for
# tank_percentage_full if those ids do not match.
type: vertical-stack
cards:
  - type: gauge
    entity: sensor.my_tank_tank_percentage_full
    name: Heating oil
    needle: true
    min: 0
    max: 100
    severity:
      red: 0
      yellow: 25
      green: 35
  - type: entities
    title: Heating oil
    entities:
      - entity: sensor.my_tank_oil_level
        name: Level
      - entity: sensor.heating_oil_run_out_date
        name: Run out date
      - entity: sensor.my_tank_forecast_empty
        name: Days until empty
      - entity: sensor.my_tank_last_reading_date
        name: Last reading
      - entity: sensor.heating_oil_price_per_litre
        name: Price
      - entity: input_number.heating_oil_order_litres
        name: Oil order litres
      - entity: sensor.heating_oil_order_cost
        name: Order cost (approximate cost)
      - entity: input_select.heating_oil_date_format
        name: Date format
  - type: entities
    title: Oil price source
    show_header_toggle: false
    entities:
      - entity: input_text.heating_oil_price_url
        name: Oil price page URL
      - entity: input_text.heating_oil_price_selector
        name: Oil price CSS selector
      - entity: input_boolean.heating_oil_price_is_pence
        name: Oil price is pence
