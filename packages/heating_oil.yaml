input_text:
  heating_oil_price_url:
    name: Oil price page URL
    min: 8
    max: 255
    initial: https://homefuelsdirect.co.uk/home/heating-oil-prices/london
    icon: mdi:web
    mode: text
  heating_oil_price_selector:
    name: Oil price CSS selector
    min: 1
    max: 255
    initial: "#currentLivePrice"
    icon: mdi:code-tags
    mode: text

input_boolean:
  heating_oil_price_is_pence:
    name: Oil price is pence
    icon: mdi:currency-gbp
    initial: true

input_number:
  heating_oil_order_litres:
    name: Oil order litres
    min: 1
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: L
    initial: 500
    icon: mdi:barrel

input_select:
  heating_oil_date_format:
    name: Date format
    options:
      - System default
      - DD/MM/YYYY
      - MM/DD/YYYY
      - YYYY-MM-DD
      - D Month YYYY
    initial: System default
    icon: mdi:calendar-clock

template:
  - sensor:
      - name: Heating oil order cost
        unique_id: heating_oil_order_cost
        device_class: monetary
        state_class: measurement
        unit_of_measurement: GBP
        icon: mdi:cash
        availability: >-
          {{ states('sensor.heating_oil_price_per_litre') | float(none) is number }}
        state: >-
          {{ (
            states('sensor.heating_oil_price_per_litre') | float(0)
            * states('input_number.heating_oil_order_litres') | float(0)
          ) | round(2) }}
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_select.heating_oil_date_format
      - trigger: template
        value_template: >-
          {% set ns = namespace(v='') %}
          {% for s in states.sensor
             if s.entity_id.endswith('_forecast_empty')
             or s.entity_id.endswith('_last_reading_date') %}
            {% set ns.v = ns.v ~ s.state %}
          {% endfor %}
          {{ ns.v }}
    sensor:
      - name: Heating oil run out date
        unique_id: heating_oil_run_out_date
        icon: mdi:calendar-end
        availability: >-
          {% set ns = namespace(days=none, base=none) %}
          {% for s in states.sensor if s.entity_id.endswith('_forecast_empty') %}
            {% set d = s.state | float(none) %}
            {% if d is number %}
              {% set ns.days = d | int %}
              {% set last_id = 'sensor.' ~ (
                s.object_id | replace('_forecast_empty', '_last_reading_date')
              ) %}
              {% set ns.base = states(last_id) | as_datetime %}
            {% endif %}
          {% endfor %}
          {{ ns.days is number and ns.base is not none }}
        state: >-
          {% set ns = namespace(days=none, base=none) %}
          {% for s in states.sensor if s.entity_id.endswith('_forecast_empty') %}
            {% set d = s.state | float(none) %}
            {% if d is number %}
              {% set ns.days = d | int %}
              {% set last_id = 'sensor.' ~ (
                s.object_id | replace('_forecast_empty', '_last_reading_date')
              ) %}
              {% set ns.base = states(last_id) | as_datetime %}
            {% endif %}
          {% endfor %}
          {% set dt = ns.base + timedelta(days=ns.days) %}
          {% set fmt = states('input_select.heating_oil_date_format') %}
          {% if fmt in ['unknown', 'unavailable', ''] %}
            {% set fmt = 'DD/MM/YYYY' %}
          {% endif %}
          {% if fmt == 'DD/MM/YYYY' %}
            {{ dt.strftime('%d/%m/%Y') }}
          {% elif fmt == 'MM/DD/YYYY' %}
            {{ dt.strftime('%m/%d/%Y') }}
          {% elif fmt == 'YYYY-MM-DD' %}
            {{ dt.strftime('%Y-%m-%d') }}
          {% elif fmt == 'D Month YYYY' %}
            {{ dt.day }} {{ dt.strftime('%B %Y') }}
          {% else %}
            {{ dt.timestamp() | timestamp_custom('%x', true) }}
          {% endif %}

rest:
  - resource_template: >-
      {% set u = states('input_text.heating_oil_price_url') | trim %}
      {{ u if u.startswith('https://') or u.startswith('http://') else
         'https://homefuelsdirect.co.uk/home/heating-oil-prices/london' }}
    scan_interval: 86400
    timeout: 30
    headers:
      User-Agent: Mozilla/5.0 (compatible; Home Assistant)
    sensor:
      - name: Heating oil price per litre
        unique_id: heating_oil_price_per_litre
        device_class: monetary
        state_class: measurement
        unit_of_measurement: GBP/L
        icon: mdi:currency-gbp
        availability: >-
          {{ value is string and value | length > 0 }}
        value_template: >-
          {% set ns = namespace(raw=none) %}
          {% set sel = states('input_text.heating_oil_price_selector') | trim %}
          {% if sel.startswith('#') %}
            {% set found = value | regex_findall(
              'id=["\']' ~ sel[1:] ~ '["\'][^>]*>\s*([0-9]+(?:[.,][0-9]+)?)',
              ignorecase=true) %}
            {% if found %}{% set ns.raw = found[0] %}{% endif %}
          {% elif '.' in sel %}
            {% set cls = sel.split('.')[-1] %}
            {% set found = value | regex_findall(
              'class=["\'][^"\']*' ~ cls ~ '[^"\']*["\'][^>]*>\s*([0-9]+(?:[.,][0-9]+)?)',
              ignorecase=true) %}
            {% if found %}{% set ns.raw = found[0] %}{% endif %}
          {% endif %}
          {% if ns.raw is none %}
            {% set found = value | regex_findall(
              '([0-9]+(?:[.,][0-9]+)?)\s*pence',
              ignorecase=true) %}
            {% if found %}{% set ns.raw = found[0] %}{% endif %}
          {% endif %}
          {% if ns.raw is none %}
            unknown
          {% else %}
            {% set n = ns.raw | replace(',', '.') | float(0) %}
            {% if is_state('input_boolean.heating_oil_price_is_pence', 'on') %}
              {{ (n / 100) | round(4) }}
            {% else %}
              {{ n | round(4) }}
            {% endif %}
          {% endif %}

automation:
  - id: heating_oil_price_refresh
    alias: Heating oil price refresh
    description: Re-fetch the oil price when the scrape URL, selector, or pence toggle changes.
    trigger:
      - trigger: state
        entity_id:
          - input_text.heating_oil_price_url
          - input_text.heating_oil_price_selector
          - input_boolean.heating_oil_price_is_pence
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none }}"
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.heating_oil_price_per_litre
    mode: single
